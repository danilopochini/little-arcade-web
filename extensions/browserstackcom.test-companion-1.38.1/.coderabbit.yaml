# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
    fail_commit_status: true
    request_changes_workflow: true
    auto_review:
        enabled: true
        drafts: false
    review_details: true
    high_level_summary_in_walkthrough: true

    path_instructions:
        - path: "proto/**"
          instructions: |
              Treat wire-incompatible changes as breaking: changed field numbers or
              types, removed fields or enum values without `reserved`, renamed
              packages, services or RPCs. Check every consumer of the changed
              messages (extension host under `src/`, `webview-ui/`, and any linked
              repository that uses them) and name the ones that would break.

    tools:
        opengrep:
            enabled: true
        eslint:
            enabled: true
            config_file: ".eslintrc.json"

    pre_merge_checks:
        custom_checks:
            - name: E2E test covers this change
              mode: warning
              instructions: |
                  Only run this check if the PR changes files under `src/`, `webview-ui/`
                  or `proto/`. Otherwise pass immediately.

                  Pass immediately if any of these hold:
                  - The description has a line starting with `E2E-Skip:` and a ticket
                    matching `STM-[0-9]+`.
                  - The PR carries the label `e2e-gate-override`.
                  - The head branch is `production-release` (the release sync; its
                    contents were gated individually already).

                  Otherwise:
                  1. Read the `Automation:` line in the description. If there is none,
                     say so and stop — the E2E Test Gate already blocks on that, and
                     repeating it here just trains people to ignore both.

                     It must be a FULL PR or branch URL. That is the only form both
                     readers parse: the gate accepts a bare branch name too, but this
                     check's linked-repository resolver does not, and an unresolvable
                     ref silently falls back to comparing against the automation repo's
                     DEFAULT branch — where an unmerged spec does not exist. That is
                     what produced three misleading verdicts on PRs #2008, #2012 and
                     #2016. If the ref is not a URL, say exactly that and PASS: the
                     author must fix the line, and this check cannot judge without it.
                  2. That URL is resolved as a linked-repository ref, so the automation
                     branch is already in your review context — the summary states
                     "reviewed against open PR #N <branch> instead of the default
                     branch". Read the specs under `src/e2e/**/*.test.ts` that the ref
                     adds or modifies relative to the base the E2E Test Gate uses: for
                     a PR URL, that automation PR's own base branch; for a branch URL,
                     the automation branch paired with this PR — this PR's head branch
                     if it is `main` or `production-release`, else this PR's base
                     branch if it is one of those, else `production-release`.

                     DISCARD any whose path falls under a directory named in
                     `parkedPaths` in that repo's `ci/test-lanes.json` (today
                     `deprecated/` and `mobile/`). No lane runs those, so a spec there
                     is not coverage. If every related spec is parked, report that no
                     runnable spec covers the change.

                     The E2E Test Gate comment on this PR lists the same specs with
                     their diff, but you cannot read PR comments — verified on #2012
                     and #2016 — so do not depend on it or fail a PR for its absence.
                  3. Judge whether those specs exercise the behaviour this PR changes. A
                     change under `src/integrations/jira/` covered by a spec under
                     `src/e2e/integrations/jira-*.test.ts` is covered; a webview change
                     covered by a spec asserting that component's rendered state is too.

                  Report a FAILURE only when the added specs plainly do not relate to the
                  changed code — e.g. the PR changes Jira integration and the only added
                  spec covers visual testing. Name the areas that look uncovered and the
                  spec you expected.

                  Be conservative. Folder names do not map one-to-one between these repos
                  and one spec often covers several files. If unsure, PASS and say what
                  you could not determine: a false alarm costs more than a miss here,
                  because the deterministic gate already guarantees a test exists.

            - name: Security review
              mode: warning
              instructions: |
                  Pass immediately if the PR only changes docs or CHANGELOG. Test code
                  runs in CI, so review it too.

                  Judge only code this PR adds or changes. Fail only for a High or
                  Critical issue with a concrete path from untrusted input (LLM output,
                  tool arguments, workspace files or settings, web or ticket content, MCP
                  servers, webview messages, network responses) to a sink: a shell or
                  process spawn, a file write outside the workspace, a token sent to a
                  non-BrowserStack host, a request to a localhost, private or
                  caller-chosen address, a secret in logs, telemetry or the webview, a
                  widened auto-approval, unsanitised HTML rendering, or a security check
                  that now fails open.

                  For each failure give file:line, the input, the sink and the fix, one
                  sentence each. Do not report pre-existing code or hardening advice. If
                  unsure, pass and say what you could not confirm.

knowledge_base:
    linked_repositories:
        - repository: browserstack/llm_router
          instructions: >-
              Backend that routes requests from this extension to LLM providers
              and owns model selection, skills, and prompt routing server-side.
              Calls to it go through RouterHandler.
        - repository: browserstack/test-companion-automation
          instructions: >-
              The e2e automation suite for this extension. Its specs live under
              src/e2e/ and drive a real IDE through the `driver` fixture. A PR here
              names the branch or PR carrying its tests with an `Automation:` line in
              the description — read that ref when judging whether a change is covered.
        - repository: browserstack/test-companion-cloud
          instructions: >-
              The cloud backend (Argus) this extension calls over HTTPS for agent
              sessions and Jira/Confluence integrations. Authority on the server-side
              contract behind Cloud Mode.

    code_guidelines:
        filePatterns:
            - "browserstack/browserstack-ai-harness-ai-labs:stacks/stack-domain-vscode-ai-testing/rules/**/*.md"
            - "browserstack/browserstack-ai-harness-ai-labs:stacks/stack-domain-vscode-ai-testing/agents/*review*.md"
            - "browserstack/browserstack-ai-harness-ai-labs:stacks/stack-domain-vscode-ai-testing/skills/*review*.md"
            - "browserstack/browserstack-ai-harness-ai-labs:stacks/stack-workspace-test-companion/agents/*review*.md"
            - "browserstack/browserstack-ai-harness-ai-labs:stacks/stack-domain-vscode-ai-testing/knowledge/docs/**/*.md"
            - "browserstack/browserstack-ai-harness-ai-labs:stacks/stack-domain-vscode-ai-testing/knowledge/review/**/*.md"
