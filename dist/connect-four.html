<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e8">
    <title>Connect Four</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./game.js"></script>
  </head>
  <body>
    <main class="game">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-disc brand-disc-red"></span>
          <span class="brand-disc brand-disc-yellow"></span>
        </div>
        <div>
          <p class="eyebrow">A classic strategy game</p>
          <h1>Connect Four</h1>
        </div>
      </header>

      <section class="game-card" aria-label="Connect Four game">
        <div class="status-bar" id="status-bar" data-state="loading">
          <span class="status-indicator" aria-hidden="true"></span>
          <p id="game-status" role="status" aria-live="polite">Loading game...</p>
        </div>

        <div class="players" aria-label="Players">
          <div class="player-card" id="human-card">
            <span class="player-disc disc-red" aria-hidden="true"></span>
            <span class="player-details">
              <span class="player-name">You</span>
              <span class="player-color">Red</span>
            </span>
          </div>
          <div class="player-card" id="computer-card">
            <span class="player-disc disc-yellow" aria-hidden="true"></span>
            <span class="player-details">
              <span class="player-name">Computer</span>
              <span class="player-color">Yellow</span>
            </span>
          </div>
        </div>

        <div class="board-frame">
          <div
            class="board"
            id="game-board"
            role="group"
            aria-label="Connect Four board, 6 rows by 7 columns"
          ></div>
        </div>

        <p class="instructions">Choose a column to drop your red piece.</p>
        <button class="new-game-button" id="new-game" type="button" disabled>
          New Game
        </button>
      </section>

      <footer class="page-footer">You play red. The computer plays yellow.</footer>
    </main>
  </body>
</html>
